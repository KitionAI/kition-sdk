<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Kition SDK: embed a kit's editor in your app, and give agents the same document</title>
  <desc id="hero-desc">A kit's engine, written once in Rust, gives your app an embedded editor over your storage and users, gives AI agents tools over MCP, and draws its own editor in a Web Worker. All of them work on the same file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5645d4" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #fafaf9; }
    .card { fill: #ffffff; stroke: #e5e3df; stroke-width: 1.25; }
    .engine { fill: #5645d4; }
    .title { fill: #1a1a1a; font-size: 22px; font-weight: 650; }
    .sub { fill: #5d5b54; font-size: 15px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; fill: #3a2a99; }
    .chip { fill: #ecebfb; }
    .on-primary { fill: #ffffff; }
    .on-primary-soft { fill: #d6d0fa; }
    .head { fill: #1a1a1a; font-size: 30px; font-weight: 700; }
    .lede { fill: #5d5b54; font-size: 17px; }
    .line { fill: none; stroke: #5645d4; stroke-width: 2; }
    .dash { fill: none; stroke: #c8c4be; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .muted { fill: #8a8780; font-size: 13px; }
    .window { fill: #f6f5f4; }
    .dot { fill: #c8c4be; }
    .accent { fill: #5645d4; }
    .soft { fill: #e6e0f5; }
    .term { fill: #1a1a1a; }
    .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #d6d0fa; }
    .term-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8a8780; }
  </style>
  <rect class="bg" width="1280" height="600" rx="12" />

  <text class="head" x="64" y="84">Real editors in your app. The same file for your agents.</text>
  <text class="lede" x="64" y="116">Embed a kit's editor over your own storage and users; agents edit the same documents with the same engine.</text>

  <!-- The engine -->
  <g filter="url(#shadow)">
    <rect class="engine" x="64" y="214" width="330" height="236" rx="12" />
  </g>
  <text class="on-primary" x="92" y="258" font-size="13" font-weight="600" letter-spacing="1.2">YOUR KIT</text>
  <text class="on-primary" x="92" y="294" font-size="26" font-weight="700">One engine</text>
  <text class="on-primary-soft" x="92" y="324" font-size="15">Rust, implementing KitDocument</text>
  <text class="on-primary-soft" x="92" y="348" font-size="15">Opens, edits, renders, saves</text>
  <rect x="92" y="372" width="134" height="32" rx="8" fill="#4534b3" />
  <text class="on-primary" x="159" y="393" font-size="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WebAssembly</text>
  <rect x="236" y="372" width="134" height="32" rx="8" fill="#4534b3" />
  <text class="on-primary" x="303" y="393" font-size="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">native binary</text>

  <!-- Arrows -->
  <path class="line" d="M394 300 C 470 300, 470 196, 548 196" marker-end="url(#arrow)" />
  <path class="line" d="M394 332 L 548 332" marker-end="url(#arrow)" />
  <path class="line" d="M394 364 C 470 364, 470 468, 548 468" marker-end="url(#arrow)" />

  <!-- Editor in the page -->
  <g filter="url(#shadow)"><rect class="card" x="552" y="146" width="664" height="104" rx="12" style="stroke:#5645d4;stroke-width:2" /></g>
  <rect class="window" x="576" y="166" width="128" height="64" rx="8" />
  <rect class="dot" x="584" y="176" width="28" height="46" rx="4" />
  <rect x="618" y="176" width="78" height="46" rx="4" fill="#ffffff" stroke="#5645d4" stroke-width="1.5" />
  <rect class="soft" x="626" y="186" width="48" height="6" rx="3" />
  <rect class="soft" x="626" y="198" width="60" height="6" rx="3" />
  <text class="title" x="728" y="184">Embed in your app</text>
  <text class="sub" x="728" y="208">The kit's editor in your page, over your storage and users.</text>
  <rect class="chip" x="728" y="220" width="126" height="22" rx="6" /><text class="mono" x="738" y="236">@kition/embed</text>
  <rect class="chip" x="862" y="220" width="180" height="22" rx="6" /><text class="mono" x="872" y="236">@kition/embed-server</text>

  <!-- Headless for agents -->
  <g filter="url(#shadow)"><rect class="card" x="552" y="280" width="664" height="104" rx="12" /></g>
  <rect class="term" x="576" y="300" width="128" height="64" rx="8" />
  <text class="term-dim" x="586" y="320">$ note_run</text>
  <text class="term-text" x="586" y="338">applied 1 step</text>
  <text class="term-dim" x="586" y="356">$ note_check</text>
  <text class="title" x="728" y="318">Agents on the same file</text>
  <text class="sub" x="728" y="342">The same engine as a program: MCP tools, scripts, servers, tests.</text>
  <rect class="chip" x="728" y="354" width="142" height="22" rx="6" /><text class="mono" x="738" y="370">kition-kits-mcp</text>
  <rect class="chip" x="878" y="354" width="134" height="22" rx="6" /><text class="mono" x="888" y="370">@kition/script</text>

  <!-- Embedded in any app -->
  <g filter="url(#shadow)"><rect class="card" x="552" y="414" width="664" height="104" rx="12" /></g>
  <rect class="window" x="576" y="434" width="128" height="64" rx="8" />
  <circle class="dot" cx="588" cy="444" r="3" /><circle class="dot" cx="598" cy="444" r="3" /><circle class="dot" cx="608" cy="444" r="3" />
  <rect class="soft" x="586" y="456" width="70" height="8" rx="4" />
  <rect class="soft" x="586" y="470" width="104" height="6" rx="3" />
  <rect class="soft" x="586" y="482" width="88" height="6" rx="3" />
  <text class="title" x="728" y="452">Build your own kit</text>
  <text class="sub" x="728" y="476">Your engine draws its own editor and runs in a Web Worker.</text>
  <rect class="chip" x="728" y="488" width="168" height="22" rx="6" /><text class="mono" x="738" y="504">@kition/kit-editor</text>
  <rect class="chip" x="904" y="488" width="96" height="22" rx="6" /><text class="mono" x="914" y="504">kition-kit</text>
  <text class="muted" x="64" y="560">Motion, Note and Table are kits built this way. A person and an agent open the same file with the same engine.</text>
</svg>
