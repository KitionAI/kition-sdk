name: kits-index
# Publishes the kit index `kition` reads by default (crates/kition-cli/src/index.rs DEFAULT_INDEX,
# sdk.json binaries.cli.defaultIndex): the npm package @kition/kits-index, its `kits-index.json`,
# at its `latest`. kition downloads it from npm registries (registry.npmjs.org, its mirror
# registry.npmmirror.com, or one the person names), as it downloads the kits.
#
# Each kit repository's Package workflow (KitionAI/kition .github/workflows/kit-package.yml)
# publishes every kit version as npm packages, @kition/kit-<kit>-<platform> and
# @kition/kit-<kit>-ui, whose package.json carries a `kition` field (tools/kit-npm.mjs);
# tools/kits-index.mjs reads the registry's metadata of the packages of every kit KitionAI/kition's
# kits/modules.json names (no tarball is downloaded) and writes the index (docs/sdk/distribution.md).
# A version this repository's kits-withdrawn.json names (one published by mistake, which npm keeps)
# is never listed: the tool reads that file by default, so a change to it reaches the index at the
# next run.
# A version still being published (lacking a package, a platform or the editor, that the kit's
# highest listed lower version has) is held back, not listed, and named in the report; a package
# whose tarball npm does not serve yet (a 404, for a minute or two after a publish) counts as
# not published in that run.
# A run:
# - stops, publishing nothing, when the registry cannot be read or a package's metadata is not what
#   the contract says (the tool's exit status 1);
# - publishes nothing when the index would hold no kit (exit status 3), so an empty index never
#   replaces a good one;
# - publishes a new version of @kition/kits-index only when the index's bytes differ from those of
#   the one published: version 0.1.<n>, n one more than the published one's,
#   tagged latest. A version published is never replaced.
# Started by hand only (Actions tab, or gh workflow run kits-index.yml): it has no schedule, so a
# new kit version reaches the index when a maintainer runs it.
#
# The input `scope` (default @kition) is passed on as KITION_NPM_SCOPE: in any other scope the
# packages are named by layout 1 (tools/kit-npm.mjs), the kits <scope>/<kit>-<platform> and
# <scope>/<kit>, the index <scope>/kits. Such a scope publishes with the secret NPM_TOKEN_STAGE
# instead of NPM_TOKEN and asks npmmirror for no copy.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: The npm scope of the kits and the index (@kition, or @kitionstage for a rehearsal)
        required: false
        default: '@kition'
        type: string
permissions: {}
concurrency:
  group: kits-index-${{ inputs.scope || '@kition' }}
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      KITION_NPM_SCOPE: ${{ inputs.scope || '@kition' }}
      REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - name: Check out Kition, for its kits/modules.json
        uses: actions/checkout@v4
        with:
          repository: KitionAI/kition
          ref: main
          path: target/kition
          sparse-checkout: kits/modules.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      # The index package of the scope, as tools/kit-npm.mjs names it (@kition/kits-index); a
      # malformed scope stops the run here.
      - name: The index package
        run: echo "PACKAGE=$(node --input-type=module -e "import { indexPackage } from './tools/kit-npm.mjs'; console.log(indexPackage())")" >> "$GITHUB_ENV"
      # The published index, when there is one. A failure to ask is not "none published".
      - name: The published index
        id: published
        run: |
          set -euo pipefail
          mkdir -p target/published
          status=$(curl -sS -o target/published/latest.json -w '%{http_code}' "${REGISTRY}${PACKAGE/\//%2f}/latest")
          case "$status" in
            200)
              version=$(node -p 'require("./target/published/latest.json").version')
              # npm pack's file name: the name without @, / as - (kition-kits-index-<version>.tgz).
              tarball="$(printf '%s' "${PACKAGE#@}" | tr / -)-$version.tgz"
              (cd target/published && npm pack "$PACKAGE@$version" --silent > /dev/null && tar -xzf "$tarball" package/kits-index.json && mv package/kits-index.json kits-index.json)
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "no $PACKAGE published yet: this run publishes its first version"; echo "version=" >> "$GITHUB_OUTPUT" ;;
            *) echo "cannot ask $REGISTRY for $PACKAGE (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Gather the index from the kit packages' metadata
        id: gather
        env:
          PUBLISHED: ${{ steps.published.outputs.version }}
        run: |
          set -uo pipefail
          previous=()
          [ -f target/published/kits-index.json ] && previous=(--previous target/published/kits-index.json)
          case "$PUBLISHED" in 0.1.*) next="0.1.$(( ${PUBLISHED##*.} + 1 ))" ;; *) next=0.1.0 ;; esac
          node tools/kits-index.mjs --modules target/kition/kits/modules.json --registry "$REGISTRY" \
            --out target/kits-index/kits-index.json --package target/kits-index/package --version "$next" "${previous[@]}" | tee target/kits-index-report.txt
          status=${PIPESTATUS[0]}
          { echo '```text'; cat target/kits-index-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "next=$next" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::the index would be empty; the published one stays as it is"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Publish it when it changed
        if: steps.gather.outputs.publish == 'true'
        env:
          # @kition publishes with NPM_TOKEN; any other scope (a rehearsal) with NPM_TOKEN_STAGE.
          NODE_AUTH_TOKEN: ${{ (inputs.scope || '@kition') == '@kition' && secrets.NPM_TOKEN || secrets.NPM_TOKEN_STAGE }}
          NEXT: ${{ steps.gather.outputs.next }}
          PUBLISHED: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          # A published version that is not 0.1.<n> is replaced as latest even with the same bytes.
          if [[ "$PUBLISHED" == 0.1.* ]] && [ -f target/published/kits-index.json ] && cmp -s target/published/kits-index.json target/kits-index/kits-index.json; then
            echo "kits-index.json is unchanged"
            exit 0
          fi
          npm publish target/kits-index/package --access public --provenance --tag latest
          echo "published $PACKAGE@$NEXT" | tee -a "$GITHUB_STEP_SUMMARY"
          # npmmirror copies npmjs.org on its own schedule; ask it now, so kition there sees the
          # new index sooner. A refusal is only a warning: kition falls back to npmjs.org. Not for
          # another scope than @kition (a rehearsal).
          [ "$KITION_NPM_SCOPE" = '@kition' ] || exit 0
          curl -fsS -X PUT "https://registry-direct.npmmirror.com/-/package/$PACKAGE/syncs" || echo "::warning::npmmirror did not take the copy request for $PACKAGE"
