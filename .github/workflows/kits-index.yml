name: kits-index
# Publishes the kit index `kition` reads by default (crates/kition-cli/src/index.rs DEFAULT_INDEX,
# sdk.json binaries.cli.defaultIndex):
#
#   https://raw.githubusercontent.com/KitionAI/kition-sdk/kits-index/kits-index.json
#
# the file kits-index.json on the branch `kits-index` of this repository, which holds that one file
# and nothing else. This is the one deliberately mutable thing this repository publishes: everything
# else (releases, tags, assets, npm versions) is published once and never replaced
# (docs/sdk/distribution.md). It is a branch, not a release asset, because this repository's
# releases are immutable, so no release could have its asset replaced.
#
# Each kit repository publishes its own archives and an index fragment in its package-v<version>
# releases (KitionAI/kition docs/kits.md, section 4b); tools/kits-index.mjs merges the fragments of
# every kit KitionAI/kition's kits/modules.json names into one index. A run:
# - stops, publishing nothing, when a kit repository cannot be listed, a fragment cannot be read,
#   or a fragment disagrees with its release (the tool's exit status 1);
# - publishes nothing when the index would hold no kit (exit status 3), so an empty index never
#   replaces a good one;
# - commits the new index on top of the branch only when its bytes differ from the published one,
#   and pushes it without force (a fast-forward), so the branch's history is the index's history.
# Started by hand from the Actions tab, and every hour.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions: {}
concurrency:
  group: kits-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      # The published index, when the branch exists. A failure to ask is not "no branch".
      - name: The published index
        id: published
        run: |
          set -euo pipefail
          mkdir -p target/published
          status=0
          git ls-remote --exit-code --heads origin kits-index >/dev/null || status=$?
          case "$status" in
            0)
              git fetch --depth 1 origin kits-index
              git show FETCH_HEAD:kits-index.json > target/published/kits-index.json
              echo "parent=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
              ;;
            2) echo "no branch kits-index yet: this run makes it" ;;
            *) echo "cannot ask origin for the branch kits-index (git ls-remote exit $status)" >&2; exit 1 ;;
          esac
      - name: Gather the index from the kit repositories
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          previous=()
          [ -f target/published/kits-index.json ] && previous=(--previous target/published/kits-index.json)
          node tools/kits-index.mjs --out target/kits-index/kits-index.json "${previous[@]}" | tee target/kits-index-report.txt
          status=${PIPESTATUS[0]}
          { echo '```text'; cat target/kits-index-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::the index would be empty; the published one stays as it is"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Publish it when it changed
        if: steps.gather.outputs.publish == 'true'
        env:
          PARENT: ${{ steps.published.outputs.parent }}
        run: |
          set -euo pipefail
          if [ -f target/published/kits-index.json ] && cmp -s target/published/kits-index.json target/kits-index/kits-index.json; then
            echo "kits-index.json is unchanged"
            exit 0
          fi
          blob=$(git hash-object -w target/kits-index/kits-index.json)
          tree=$(printf '100644 blob %s\tkits-index.json\n' "$blob" | git mktree)
          parent=()
          [ -n "$PARENT" ] && parent=(-p "$PARENT")
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" "${parent[@]}" -m "kits-index.json from the kit repositories' fragments (run $GITHUB_RUN_ID, $GITHUB_SHA)")
          git push origin "$commit:refs/heads/kits-index"
          echo "published kits-index.json as $commit" | tee -a "$GITHUB_STEP_SUMMARY"
