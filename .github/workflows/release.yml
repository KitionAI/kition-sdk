name: release
# Publishes one Kition SDK version, sdk.json `version`, from one build of every executable:
# - the GitHub Release sdk-v<version> of this repository: the SDK bundle of each platform
#   (tools/sdk-bundle.mjs: npm tarballs, kit packages, bin/<platform>/ with kition-kits,
#   kition-kits-mcp and each published kit's headless executable, docs, schemas, manifest.json,
#   SHA256SUMS); kition-<version>-<platform>.tar.gz (tools/release-archives.mjs); kits-index.json,
#   a snapshot of the kit index gathered when the release is made (tools/kits-index.mjs); install.sh
#   and install.ps1; the release manifest kition-sdk-<version>.json, every schema, and SHA256SUMS
#   (tools/sdk-release.mjs), with build provenance attestations;
# - the public @kition/* packages on npm, with @kition/cli (the `kition` command, a Node launcher),
#   @kition/cli-<platform> (which carries the kition executable), and @kition/dsh-kits (the
#   DeepSeek Harness plugin, which depends on @kition/cli at its own version and runs that kition).
# Each published kit's executable is built from the tag that Kition's kits/kits.lock.json pins for
# its package, and must answer kit.initialize with that package's version. A release publishes no
# kit archive: each kit repository publishes its own archives, and .github/workflows/kits-index.yml
# gathers the index `kition` reads, on the branch kits-index (docs/sdk/distribution.md). The
# release's kits-index.json is only a snapshot of it, for kition 0.3.0 and 0.4.0, which read
# releases/latest/download/kits-index.json.
# Run it by hand from the Actions tab. A release is never replaced, and an npm version already
# published is skipped; bump sdk.json to publish a change.
# Order: everything is built and checked first; then the GitHub Release is made as a draft (no
# tag yet, and it can still be deleted); then the npm packages are published (a version published
# on npm can never be used again: the least reversible step); then the draft is published. A run
# that stops in between is run again from the same commit ("Re-run failed jobs"): it replaces the
# draft, skips what npm has, and publishes the rest. A version whose release is published already
# is not released again: a run from its tag (sdk-v<version>) publishes only the npm packages still
# missing, with the released kition executables (docs/sdk/distribution.md, "When a release stops
# half-way").
on:
  workflow_dispatch:
    inputs:
      kition_commit:
        description: "The KitionAI/kition commit (full SHA) whose kits/kits.lock.json pins the published kits' packages"
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      # Not released yet (no release, or a draft left by a run that stopped, which the publish job
      # checks): the whole release. Released already: only the npm packages still missing, from
      # the released commit.
      - name: The version's release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          if ! state=$(gh release view "sdk-v$version" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null); then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(node -p 'JSON.parse(process.argv[1]).isDraft' "$state")" = true ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged=$(git ls-remote origin "refs/tags/sdk-v$version^{}" | cut -f1)
          [ -n "$tagged" ] || tagged=$(git ls-remote origin "refs/tags/sdk-v$version" | cut -f1)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::sdk-v$version is released from $tagged; bump sdk.json to publish a change, or run this workflow from the tag sdk-v$version to publish its npm packages still missing"
            exit 1
          fi
          echo "::notice::sdk-v$version is released: this run publishes only its npm packages still missing"
          echo "released=true" >> "$GITHUB_OUTPUT"
      - name: Kition's kit lock at the commit given
        env:
          KITION_COMMIT: ${{ inputs.kition_commit }}
        run: |
          set -euo pipefail
          [[ "$KITION_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "kition_commit must be a full commit SHA" >&2; exit 1; }
          mkdir -p target/lock
          curl -fsSL "https://raw.githubusercontent.com/KitionAI/kition/$KITION_COMMIT/kits/kits.lock.json" -o target/lock/kits.lock.json
          node -e '
            const lock = require("./target/lock/kits.lock.json")
            for (const kit of require("./published-kits.json")) {
              const pinned = lock[kit]
              if (!pinned) { console.error(`the lock pins no ${kit}`); process.exit(1) }
              console.log(`${kit} ${pinned.version} ${pinned.tag} ${pinned.commit}`)
            }'
      - uses: actions/upload-artifact@v4
        with:
          name: kits-lock
          path: target/lock/kits.lock.json
          if-no-files-found: error

  # The npm package @kition/cli (packages/kition), packed once: every platform installs this archive in its smoke test,
  # and the publish job publishes it.
  launcher:
    needs: lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Check out Kition Tessera beside the SDK
        run: |
          git clone --depth 1 https://github.com/KitionAI/kition-tessera "$GITHUB_WORKSPACE/../kition-tessera"
          cd "$GITHUB_WORKSPACE/../kition-tessera" && pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: node tools/pack-public-packages.mjs kition
      - uses: actions/upload-artifact@v4
        with:
          name: kition-launcher
          path: target/npm-pack/kition.tgz
          if-no-files-found: error

  # Every executable, built and checked on its own platform (packages/kition/src/platforms.json).
  executables:
    needs: [lock, launcher]
    strategy:
      # Every platform runs to its end, so one run shows every platform's failure.
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, glibc: '2.17' }
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, glibc: '2.17' }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # Linux: the glibc floor, the oldest glibc the executables run on (docs/sdk/distribution.md).
      # They are linked against it with cargo-zigbuild (<target>.<glibc>), not against the runner's.
      GLIBC: ${{ matrix.glibc }}
      BUILD_TARGET: ${{ matrix.glibc && format('{0}.{1}', matrix.target, matrix.glibc) || matrix.target }}
      CARGO_BUILD: ${{ matrix.glibc && 'zigbuild' || 'build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: kits-lock
          path: target/lock
      # The tag must be the commit the lock pins, and its kit.json the version the lock pins. A kit
      # that embeds fonts has scripts/fetch-fonts.sh; one without it embeds none.
      - name: Check out each published kit at its package tag, with its fonts
        run: |
          set -euo pipefail
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            read -r repository tag commit version < <(node -p "const p = require('./target/lock/kits.lock.json')['$kit']; [p.repository, p.tag, p.commit, p.version].join(' ')")
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/$repository" "../kition-$kit"
            actual=$(git -C "../kition-$kit" rev-parse HEAD)
            [ "$actual" = "$commit" ] || { echo "$repository $tag is $actual; the lock pins $commit" >&2; exit 1; }
            declared=$(node -p "require('../kition-$kit/kit.json').version")
            [ "$declared" = "$version" ] || { echo "$repository $tag kit.json is $declared; the lock pins $version" >&2; exit 1; }
            # A relative path: Git Bash's sha256sum escapes a Windows path's backslashes.
            if [ -f "../kition-$kit/scripts/fetch-fonts.sh" ]; then bash "../kition-$kit/scripts/fetch-fonts.sh" "../fonts-$kit"; fi
          done
      # The dist profile (Cargo.toml): the shipped executables with LTO, stripped.
      - run: cargo "$CARGO_BUILD" --locked --profile dist -p kition-kits --bins -p kition-cli --target "$BUILD_TARGET"
      - name: Build each published kit's headless executable
        run: |
          set -euo pipefail
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            (
              if [ -d "../fonts-$kit" ]; then
                # The fonts folder as the compiler reads paths (D:/a/... on Windows).
                if [ "$RUNNER_OS" = Windows ]; then fonts=$(cd "../fonts-$kit" && pwd -W); else fonts=$(cd "../fonts-$kit" && pwd); fi
                export KITION_FONTS_DIR="$fonts" KITION_FONTS_REQUIRED=1
              fi
              cd "../kition-$kit" && cargo "$CARGO_BUILD" --locked --release -p "kition-$kit" --target "$BUILD_TARGET"
            )
          done
      # The executables, each kit's kit.json (kits/<kit>/kit.json), and what each kit answered to
      # kit.initialize here (handshakes.json).
      - name: Collect and check the executables
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="target/release-bin/$PLATFORM"
          mkdir -p "$out"
          cp "target/$TARGET/dist/kition-kits$exe" "target/$TARGET/dist/kition-kits-mcp$exe" "target/$TARGET/dist/kition$exe" "$out/"
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            cp "../kition-$kit/target/$TARGET/release/kition-$kit$exe" "$out/"
            mkdir -p "$out/kits/$kit"
            cp "../kition-$kit/kit.json" "$out/kits/$kit/kit.json"
          done
          if [ -n "$GLIBC" ]; then
            kits=$(node -p 'require("./published-kits.json").map((kit) => "kition-" + kit).join(" ")')
            (cd "$out" && node "$GITHUB_WORKSPACE/tools/glibc-floor.mjs" --max "$GLIBC" kition kition-kits kition-kits-mcp $kits)
          fi
          node tools/kit-handshake.mjs --record "$out"
          version=$(node -p 'require("./sdk.json").version')
          "$out/kition$exe" --version | grep -F "kition $version "
      # A version released already: npm gets the kition the release's archive holds, checked
      # against its SHA256SUMS, rather than this run's build of it.
      - name: The released kition
        if: needs.lock.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          version=$(node -p 'require("./sdk.json").version')
          archive="kition-$version-$PLATFORM.tar.gz"
          mkdir -p target/released
          gh release download "sdk-v$version" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern SHA256SUMS --dir target/released
          (cd target/released && node -e '
            const fs = require("fs"), crypto = require("crypto")
            const [archive] = process.argv.slice(1)
            const listed = fs.readFileSync("SHA256SUMS", "utf8").split("\n").find((line) => line.endsWith(` ${archive}`) || line.endsWith(` *${archive}`))
            const actual = crypto.createHash("sha256").update(fs.readFileSync(archive)).digest("hex")
            if (!listed || listed.split(/\s+/)[0] !== actual) { console.error(`${archive}: not the SHA-256 SHA256SUMS lists`); process.exit(1) }' "$archive" && tar -xzf "$archive" "kition$exe")
          cp "target/released/kition$exe" "target/release-bin/$PLATFORM/kition$exe"
          "target/release-bin/$PLATFORM/kition$exe" --version | grep -F "kition $version "
      - name: Write @kition/cli-${{ matrix.platform }}
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          node packages/kition/scripts/platform-package.mjs platform --platform "$PLATFORM" \
            --kition "target/release-bin/$PLATFORM/kition$exe" --out target/kition/npm
      - name: Pack it
        run: mkdir -p target/kition/packed && npm pack "./target/kition/npm/$PLATFORM" --pack-destination target/kition/packed
      - uses: actions/download-artifact@v4
        with:
          name: kition-launcher
          path: target/kition/launcher
      # The packed launcher, depending on the packed platform package by its file (as the
      # published one depends on it by version), installed with npm install -g into a prefix of
      # its own; its `kition` command, on the PATH, then shows its version, adds every published
      # kit built here (its kit.json and executable, in a folder of their own) into a Kition home
      # of its own, with the checks of an install, and lists them, each in use with its executable.
      - name: Smoke test kition installed from the packed packages, with the published kits
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          version=$(node -p 'require("./sdk.json").version')
          smoke="$(pwd)/target/smoke"
          mkdir -p "$smoke"
          cp target/kition/launcher/kition.tgz "$smoke/kition.tgz"
          node packages/kition/scripts/platform-package.mjs link --local --launcher "$smoke/kition.tgz" --out target/kition/packed
          npm install -g --prefix "$smoke/npm" "$smoke/kition.tgz"
          # npm puts global commands in <prefix>/bin, and on Windows in <prefix> itself.
          if [ "$RUNNER_OS" = Windows ]; then bin="$smoke/npm"; else bin="$smoke/npm/bin"; fi
          export PATH="$bin:$PATH" KITION_HOME="$smoke/home" KITION_INDEX="$smoke/no-index.json"
          [ "$(command -v kition)" = "$bin/kition" ] || { echo "kition on the PATH is $(command -v kition), not npm's $bin/kition" >&2; exit 1; }
          kition --version | grep -F "kition $version "
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            mkdir -p "$smoke/kits/$kit"
            cp "target/release-bin/$PLATFORM/kits/$kit/kit.json" "target/release-bin/$PLATFORM/kition-$kit$exe" "$smoke/kits/$kit/"
            kition kit add "$smoke/kits/$kit"
          done
          kition kit list
          kition kit list --json | node -e '
            const kits = JSON.parse(require("fs").readFileSync(0, "utf8")).kits
            const published = require("./published-kits.json")
            const missing = published.filter((kit) => !kits.some((found) => found.name === kit && found.inUse && found.executable))
            if (missing.length) { console.error(`not installed: ${missing.join(", ")}`, kits); process.exit(1) }
            console.log(kits.map((kit) => `${kit.id} ${kit.inUse} ${kit.executable}`).join("\n"))'
      - uses: actions/upload-artifact@v4
        with:
          name: kition-cli-${{ matrix.platform }}
          path: target/kition/packed/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: target/release-bin/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: [lock, executables]
    runs-on: ubuntu-24.04  # Playwright supports 24.04, not 26.04 yet
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      # The workspace links Kition Tessera from a checkout beside this repository; the bundle
      # carries the Kit Harness Protocol from its public repository.
      - name: Check out Kition Tessera and the KHP beside the SDK
        run: |
          git clone --depth 1 https://github.com/KitionAI/kition-tessera "$GITHUB_WORKSPACE/../kition-tessera"
          cd "$GITHUB_WORKSPACE/../kition-tessera" && pnpm install --frozen-lockfile
          git clone --depth 1 https://github.com/kitharness/kitharness "$GITHUB_WORKSPACE/../khp"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: kits-lock
          path: target/lock
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: target/release-bin
      # The kit index snapshot: gathered here by the aggregator itself, not copied from the branch
      # kits-index, so the release does not depend on the branch. It is for kition 0.3.0 and
      # 0.4.0, which read releases/latest/download/kits-index.json; later kition read the branch.
      # A failure, or an index with no kit (exit 3), stops the run: no release goes without it.
      - name: The kit index snapshot
        if: needs.lock.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          node tools/kits-index.mjs --out target/sdk-release/kits-index.json || status=$?
          if [ "$status" -eq 3 ]; then echo "::error::the gathered kit index holds no kit; a release does not go without kits-index.json"; fi
          exit "$status"
      - name: The SDK bundle of each platform, and the release files
        if: needs.lock.outputs.released != 'true'
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          mkdir -p target/sdk-release
          build=()
          for dir in target/release-bin/bin-*; do
            platform="${dir#target/release-bin/bin-}"
            node tools/sdk-bundle.mjs "${build[@]}" --lock target/lock/kits.lock.json --standard ../khp \
              --bin "$dir" --platform "$platform" --out "target/bundles/kition-sdk-$version-$platform" --archive
            mv "target/bundles/kition-sdk-$version-$platform.tar.gz" target/sdk-release/
            build=(--no-build)
          done
          node tools/release-archives.mjs --bin target/release-bin --out target/sdk-release
          node tools/sdk-release.mjs --dir target/sdk-release
          (cd target/sdk-release && sha256sum -c SHA256SUMS)
      - run: node tools/pack-public-packages.mjs
      # @kition/dsh-kits, the DeepSeek Harness plugin: its patch, skills, Node host module and launcher, and its
      # browser module, built and committed (lib/client.js), so the pack builds nothing.
      - run: npm pack ./plugins/deepseek-harness/kition-kits --pack-destination target/npm-pack && mv target/npm-pack/kition-dsh-kits-*.tgz target/npm-pack/dsh-kits.tgz
      # kition: the archive every platform installed in its smoke test, not a second packing.
      - uses: actions/download-artifact@v4
        with:
          name: kition-launcher
          path: target/kition/launcher
      - run: cp target/kition/launcher/kition.tgz target/npm-pack/kition.tgz
      - uses: actions/download-artifact@v4
        with:
          pattern: kition-cli-*
          path: target/kition/packed
          merge-multiple: true
      # @kition/cli depends on every platform package, optionally: npm installs the one for its platform.
      - run: node packages/kition/scripts/platform-package.mjs link --launcher target/npm-pack/kition.tgz --out target/kition/packed
      # @kition/dsh-kits depends on that @kition/cli, at its own version: installed by name from
      # these archives (a local registry), as DeepSeek Harness installs it, it brings this
      # platform's kition, which has the gateway command.
      - run: node tools/check-dsh-plugin-package.mjs --plugin target/npm-pack/dsh-kits.tgz --launcher target/npm-pack/kition.tgz --platforms target/kition/packed
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/smoke-public-packages.mjs
      - uses: actions/attest-build-provenance@v2
        if: needs.lock.outputs.released != 'true'
        with:
          subject-path: |
            target/sdk-release/*.tar.gz
            target/sdk-release/*.json
            target/sdk-release/install.sh
            target/sdk-release/install.ps1
      # A draft first: it can still be deleted, and it has no tag until it is published. A draft
      # left by a run that stopped is replaced when it is this commit's; one from another commit
      # stops the run, since npm may hold packages that run published from its commit. gh uploads
      # every asset to the draft, so the release never shows without its files.
      - name: The GitHub Release, as a draft
        if: needs.lock.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          node -e '
            const m = require(`./target/sdk-release/kition-sdk-${process.argv[1]}.json`)
            const kits = m.kits.map((k) => `- ${k.id} ${k.version}: package ${k.url} (sha256 ${k.sha256}), built from ${k.repository} ${k.tag} (${k.commit})`).join("\n")
            const platforms = Object.entries(m.platforms).map(([p, b]) => `- ${p}: ${b.bundle} (sha256 ${b.sha256})`).join("\n")
            const cli = Object.entries(m.cli).map(([p, a]) => `- ${p}: ${a.file} (sha256 ${a.sha256})`).join("\n")
            console.log([
              `Kition SDK ${m.version}, built from ${m.commit}.`, "",
              "Install kition (kits download on first use into ~/.kition/kits):",
              "- macOS, Linux: curl -fsSL https://github.com/KitionAI/kition-sdk/releases/latest/download/install.sh | sh",
              "- Windows: irm https://github.com/KitionAI/kition-sdk/releases/latest/download/install.ps1 | iex",
              "- npm (Node.js 20 or later): npm install -g @kition/cli, or npx -y @kition/cli <command>", "",
              "kition:", cli, "",
              "kition installs kits from the kit index gathered from the releases of every kit repository: https://raw.githubusercontent.com/KitionAI/kition-sdk/kits-index/kits-index.json.",
              `The kits-index.json of this release is a snapshot of that index as of the release (sha256 ${m.index.sha256}), for kition 0.3.0 and 0.4.0, which read releases/latest/download/kits-index.json.`, "",
              "Kits:", kits, "",
              "SDK bundles (bin/<platform>/ holds kition-kits, kition-kits-mcp and each kit executable):", platforms, "",
              `Every executable with its SHA-256 and the kit version it answers: kition-sdk-${m.version}.json. All assets: SHA256SUMS. Provenance: gh attestation verify <file> --repo ${m.repository}.`,
              "See docs/sdk/distribution.md.",
            ].join("\n"))' "$version" > target/release-notes.md
          if state=$(gh release view "sdk-v$version" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null); then
            target=$(node -p 'JSON.parse(process.argv[1]).targetCommitish' "$state")
            if [ "$(node -p 'JSON.parse(process.argv[1]).isDraft' "$state")" != true ]; then
              echo "::error::sdk-v$version was published while this run was going"
              exit 1
            fi
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::a run from $target stopped after drafting sdk-v$version, and npm may hold packages it published from that commit; run again from $target, or delete the draft if npm has no package of $version"
              exit 1
            fi
            gh release delete "sdk-v$version" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "sdk-v$version" target/sdk-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kition SDK $version" --notes-file target/release-notes.md --draft
      # A version on npm can never be published again: this is the step that cannot be undone,
      # so it comes after every check and after the draft. What npm has already is skipped, so a
      # run again publishes only what is missing. The libraries go first, then the platform
      # packages @kition/cli-<platform>, then @kition/cli, which depends on them, then the DeepSeek
      # Harness plugin @kition/dsh-kits, which depends on @kition/cli: a plugin on npm always has
      # its kition there.
      - name: Publish on npm in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm whoami
          publish() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$1" --access public --provenance
            fi
          }
          for p in kdm kit-ui-protocol embed kit-engine sync convergence script extensions embed-server kit-host kit-dev-host kit-editor; do
            publish "target/npm-pack/$p.tgz"
          done
          for archive in target/kition/packed/*.tgz; do publish "$archive"; done
          publish target/npm-pack/kition.tgz
          publish target/npm-pack/dsh-kits.tgz
      # Last: the draft becomes the release, and the latest one, once npm has every package it
      # tells people to install.
      - name: Publish the GitHub Release
        if: needs.lock.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          gh release edit "sdk-v$version" --repo "$GITHUB_REPOSITORY" --draft=false --latest
