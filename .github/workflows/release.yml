name: release
# Publishes one Kition SDK version, sdk.json `version`, from one build of every executable:
# - the GitHub Release sdk-v<version> of this repository: the SDK bundle of each platform
#   (tools/sdk-bundle.mjs: npm tarballs, kit packages, bin/<platform>/ with kition-kits,
#   kition-kits-mcp and each published kit's headless executable, docs, schemas, manifest.json,
#   SHA256SUMS), the release manifest kition-sdk-<version>.json, every schema, and SHA256SUMS
#   (tools/sdk-release.mjs), with build provenance attestations;
# - the public @kition/* packages on npm, with @kition/kits-mcp and @kition/kits-mcp-<platform>.
# Each published kit's executable is built from the tag that Kition's kits/kits.lock.json pins for
# its package, and must answer kit.initialize with that package's version.
# Run it by hand from the Actions tab. A release is never replaced: a version already released
# stops the run, and an npm version already published is skipped; bump sdk.json to publish again.
on:
  workflow_dispatch:
    inputs:
      kition_commit:
        description: "The KitionAI/kition commit (full SHA) whose kits/kits.lock.json pins the published kits' packages"
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The version is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          if gh release view "sdk-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "sdk-v$version is released already; bump sdk.json to publish a change" >&2
            exit 1
          fi
      - name: Kition's kit lock at the commit given
        env:
          KITION_COMMIT: ${{ inputs.kition_commit }}
        run: |
          set -euo pipefail
          [[ "$KITION_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "kition_commit must be a full commit SHA" >&2; exit 1; }
          mkdir -p target/lock
          curl -fsSL "https://raw.githubusercontent.com/KitionAI/kition/$KITION_COMMIT/kits/kits.lock.json" -o target/lock/kits.lock.json
          node -e '
            const lock = require("./target/lock/kits.lock.json")
            for (const kit of require("./published-kits.json")) {
              const pinned = lock[kit]
              if (!pinned) { console.error(`the lock pins no ${kit}`); process.exit(1) }
              console.log(`${kit} ${pinned.version} ${pinned.tag} ${pinned.commit}`)
            }'
      - uses: actions/upload-artifact@v4
        with:
          name: kits-lock
          path: target/lock/kits.lock.json
          if-no-files-found: error

  # Every executable, built and checked on its own platform (packages/kits-mcp/src/platforms.json).
  executables:
    needs: lock
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: kits-lock
          path: target/lock
      # The tag must be the commit the lock pins, and its kit.json the version the lock pins.
      - name: Check out each published kit at its package tag, with its fonts
        run: |
          set -euo pipefail
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            read -r repository tag commit version < <(node -p "const p = require('./target/lock/kits.lock.json')['$kit']; [p.repository, p.tag, p.commit, p.version].join(' ')")
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/$repository" "../kition-$kit"
            actual=$(git -C "../kition-$kit" rev-parse HEAD)
            [ "$actual" = "$commit" ] || { echo "$repository $tag is $actual; the lock pins $commit" >&2; exit 1; }
            declared=$(node -p "require('../kition-$kit/kit.json').version")
            [ "$declared" = "$version" ] || { echo "$repository $tag kit.json is $declared; the lock pins $version" >&2; exit 1; }
            # A relative path: Git Bash's sha256sum escapes a Windows path's backslashes.
            bash "../kition-$kit/scripts/fetch-fonts.sh" "../fonts-$kit"
          done
      - run: cargo build --locked --release -p kition-kits --bins --target "$TARGET"
      - name: Build each published kit's headless executable
        run: |
          set -euo pipefail
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            # The fonts folder as the compiler reads paths (D:/a/... on Windows).
            if [ "$RUNNER_OS" = Windows ]; then fonts=$(cd "../fonts-$kit" && pwd -W); else fonts=$(cd "../fonts-$kit" && pwd); fi
            (cd "../kition-$kit" && KITION_FONTS_DIR="$fonts" KITION_FONTS_REQUIRED=1 cargo build --locked --release -p "kition-$kit" --target "$TARGET")
          done
      # The executables, and what each kit answered to kit.initialize here (handshakes.json).
      - name: Collect and check the executables
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="target/release-bin/$PLATFORM"
          mkdir -p "$out"
          cp "target/$TARGET/release/kition-kits$exe" "target/$TARGET/release/kition-kits-mcp$exe" "$out/"
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            cp "../kition-$kit/target/$TARGET/release/kition-$kit$exe" "$out/"
            cp "../kition-$kit/kit.json" "target/release-bin/$kit.kit.json"
          done
          node tools/kit-handshake.mjs --record "$out"
      - name: Write @kition/kits-mcp-${{ matrix.platform }}
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="target/release-bin/$PLATFORM"
          args=()
          for kit in $(node -p 'require("./published-kits.json").join(" ")'); do
            args+=(--kit "target/release-bin/$kit.kit.json=$out/kition-$kit$exe")
          done
          node packages/kits-mcp/scripts/platform-package.mjs platform --platform "$PLATFORM" \
            --server "$out/kition-kits-mcp$exe" "${args[@]}" --out target/kits-mcp/npm
      # The server finds every kit it carries, each with its executable.
      - name: Smoke test the package
        run: |
          set -euo pipefail
          dir="target/kits-mcp/npm/$PLATFORM"
          "$dir/bin/kition-kits-mcp" --list-kits --kits-dir "$dir/kits" | node -e '
            const kits = JSON.parse(require("fs").readFileSync(0, "utf8")).kits
            const published = require("./published-kits.json")
            const missing = published.filter((kit) => !kits.some((found) => found.id === `kit.${kit}` && found.installed))
            if (missing.length) { console.error(`not installed: ${missing.join(", ")}`, kits); process.exit(1) }
            console.log(kits.map((kit) => `${kit.id} ${kit.executable}`).join("\n"))'
      - name: Pack it
        run: npm pack "./target/kits-mcp/npm/$PLATFORM" --pack-destination target/kits-mcp/packed
      - uses: actions/upload-artifact@v4
        with:
          name: kits-mcp-${{ matrix.platform }}
          path: target/kits-mcp/packed/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: target/release-bin/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: executables
    runs-on: ubuntu-24.04  # Playwright supports 24.04, not 26.04 yet
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      # The workspace links Kition Tessera from a checkout beside this repository; the bundle
      # carries the Kit Harness Protocol from its public repository.
      - name: Check out Kition Tessera and the KHP beside the SDK
        run: |
          git clone --depth 1 https://github.com/KitionAI/kition-tessera "$GITHUB_WORKSPACE/../kition-tessera"
          cd "$GITHUB_WORKSPACE/../kition-tessera" && pnpm install --frozen-lockfile
          git clone --depth 1 https://github.com/kitharness/khp "$GITHUB_WORKSPACE/../khp"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: kits-lock
          path: target/lock
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: target/release-bin
      - name: The SDK bundle of each platform, and the release files
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          mkdir -p target/sdk-release
          build=()
          for dir in target/release-bin/bin-*; do
            platform="${dir#target/release-bin/bin-}"
            node tools/sdk-bundle.mjs "${build[@]}" --lock target/lock/kits.lock.json --standard ../khp \
              --bin "$dir" --platform "$platform" --out "target/bundles/kition-sdk-$version-$platform" --archive
            mv "target/bundles/kition-sdk-$version-$platform.tar.gz" target/sdk-release/
            build=(--no-build)
          done
          node tools/sdk-release.mjs --dir target/sdk-release
          (cd target/sdk-release && sha256sum -c SHA256SUMS)
      - run: node tools/pack-public-packages.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: kits-mcp-*
          path: target/kits-mcp/packed
          merge-multiple: true
      # @kition/kits-mcp depends on every platform package, optionally: npm installs the one for its platform.
      - run: node packages/kits-mcp/scripts/platform-package.mjs link --launcher target/npm-pack/kits-mcp.tgz --out target/kits-mcp/packed
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/smoke-public-packages.mjs
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/sdk-release/*.tar.gz
            target/sdk-release/*.json
      - name: Publish on npm in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$1" --access public --provenance
            fi
          }
          # The platform packages before @kition/kits-mcp, which depends on them.
          for archive in target/kits-mcp/packed/*.tgz; do publish "$archive"; done
          cd target/npm-pack
          for p in kdm kit-ui-protocol embed kit-engine sync convergence script extensions embed-server kit-host kit-dev-host kit-editor kits-mcp; do
            publish "./$p.tgz"
          done
      # Last, so a run that failed earlier can run again. gh uploads every asset to a draft and
      # then publishes it, so the release never shows without its files.
      - name: The GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./sdk.json").version')
          node -e '
            const m = require(`./target/sdk-release/kition-sdk-${process.argv[1]}.json`)
            const kits = m.kits.map((k) => `- ${k.id} ${k.version}: package ${k.url} (sha256 ${k.sha256}), built from ${k.repository} ${k.tag} (${k.commit})`).join("\n")
            const platforms = Object.entries(m.platforms).map(([p, b]) => `- ${p}: ${b.bundle} (sha256 ${b.sha256})`).join("\n")
            console.log([
              `Kition SDK ${m.version}, built from ${m.commit}.`, "",
              "Kits:", kits, "",
              "SDK bundles (bin/<platform>/ holds kition-kits, kition-kits-mcp and each kit executable):", platforms, "",
              `Every executable with its SHA-256 and the kit version it answers: kition-sdk-${m.version}.json. All assets: SHA256SUMS. Provenance: gh attestation verify <file> --repo ${m.repository}.`,
              "See docs/sdk/distribution.md.",
            ].join("\n"))' "$version" > target/release-notes.md
          gh release create "sdk-v$version" target/sdk-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kition SDK $version" --notes-file target/release-notes.md
