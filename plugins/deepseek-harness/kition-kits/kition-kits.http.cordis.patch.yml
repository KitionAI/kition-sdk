# @kition/dsh-kits, with Kition running: the kition-kits row reaches Kition's loopback MCP
# endpoint instead of starting a server (`KitAgent 1.4` D1). A file open in a Kition kit editor
# is edited live there (the Kit AI bridge, A7); any other file through the kit's headless engine.
# Set KITION_MCP_URL to the endpoint, for example http://127.0.0.1:<port>/api/v1/mcp/kits, and
# add this file over a profile that has the plugin installed:
#
#   dsh --profile <profile> --patch <this package>/kition-kits.http.cordis.patch.yml
#
# A patch replaces a row's whole config, so this restates every key the row needs.

- id: kition-kits
  config:
    serverName: kition
    transport: streamable-http
    url: !!js process.env.KITION_MCP_URL
    toolCallTimeoutMs: 180000
