# @kition/dsh-kits: the Kition kits in DeepSeek Harness.
#
# Two rows, both on the host:
#
# - kition-kits-host: this package's host module (lib/host.mjs). It starts a `kition gateway` for a
#   session's workspace folder when something needs it, registers the kits' tools
#   (mcp__kition__kit_<action>) so each session's calls reach its own folder's gateway, and, in a
#   profile with the browser UI, serves the gateway's editor page same-origin under /kition/ behind
#   DeepSeek Harness's login. Loading the package by its name also loads its browser module
#   (`dsh.client`): kit files open in their Kition editor in the right sidebar.
# - kition-kits-skills: this package's skills (an editing skill per kit, and the person's draft
#   review) in every agent's skill catalog, from the host's global skill layer.
#
# `baseUrl` is the profile's folder, so this package's folder is where the profile resolves it.
#
#   dsh plugin --profile <profile> add @kition/dsh-kits

- insert:
    - id: kition-kits-host
      name: '@kition/dsh-kits'
    - id: kition-kits-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: kition-kits
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@kition/dsh-kits/package.json')), 'skills')"
