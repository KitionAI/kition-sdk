# @kition/dsh-kits: the Kition kits in DeepSeek Harness, without Kition running (`KitAgent 1.4` D1).
#
# Two rows, both on the host:
#
# - kition-kits: Kition's MCP server through DeepSeek Harness's own MCP client. bin/kits-mcp.mjs
#   finds the server (KITION_KITS_MCP, else kition on the PATH as `kition mcp`, else
#   kition-kits-mcp, else `npx -y @kition/cli mcp`) and serves one workspace folder:
#   KITION_WORKSPACE, else the folder dsh started in. Its tools are mcp__kition__kit_<action>.
#   (DeepSeek Harness 0.2.2-rc.5's MCP client has no on-demand tool loading: every request
#   carries the tools' definitions.)
# - kition-kits-skills: this package's skills (an editing skill per kit, and the person's draft
#   review) in every agent's skill catalog, from the host's global skill layer.
#
# `baseUrl` is the profile's folder, so this package's folder is where the profile resolves it.
#
#   dsh plugin --profile <profile> add @kition/dsh-kits

- insert:
    - id: kition-kits
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kition
        transport: stdio
        command: !!js process.execPath
        args: !!js "[process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@kition/dsh-kits/package.json')), 'bin', 'kits-mcp.mjs'), '--workspace', process.env.KITION_WORKSPACE || process.cwd()]"
        # A run of edits on a large document can take a while.
        toolCallTimeoutMs: 180000
    - id: kition-kits-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: kition-kits
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@kition/dsh-kits/package.json')), 'skills')"
