[workspace]
resolver = "3"
members = ["crates/*", "examples/grid-kit", "examples/grid-kit-headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-sdk"

# The executables a release ships (kition, kition-kits, kition-kits-mcp): smaller and a little
# faster, at a slower build. `--release` and dev builds keep Cargo's defaults.
#   cargo build --profile dist -p kition-cli   # target/dist/kition
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
