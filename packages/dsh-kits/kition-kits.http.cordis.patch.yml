# Kition's kit tools in DeepSeek Harness (`KitAgent 1.4` D1), from a running Kition.
#
# Mounts Kition's MCP endpoint through DeepSeek Harness's own MCP client, so the tools register
# on ctx.tools as mcp__kition__<kit>_inspect, _commands, and _run. A file open in a Kition kit
# editor is edited live there (the Kit AI bridge); any other file through the kit's headless
# engine. Set KITION_MCP_URL to the runtime's loopback address, for example
# http://127.0.0.1:<port>/api/v1/mcp/kits.
#
#   dsh --profile <profile> --patch kition-kits.http.cordis.patch.yml

- insert:
    - id: kition-kits
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kition
        transport: streamable-http
        url: !!js "process.env.KITION_MCP_URL"
        # A run of edits on a large document can take a while.
        toolCallTimeoutMs: 180000
