# A scripted model on 127.0.0.1:18777 (test/scripted_model.py) as a pi-ai route, so the test
# needs no model account.
- id: llm-pi-ai
  config:
    providers:
      scripted:
        api: openai-completions
        baseURL: http://127.0.0.1:18777/v1
        apiKeyEnv: SCRIPTED_API_KEY
        models:
          - id: scripted
            reasoningEfforts: false
