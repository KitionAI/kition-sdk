[package]
name = "kition-open-token"
description = "Host-signed open tokens (ko1): one person's permissions on one file version, verified offline by Kition Server and the kit host (docs/platform/managed-collab.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Signing, for host servers (Kition One's server-rs); verifiers need only the public keys.
sign = []

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
kition-open-token = { path = ".", features = ["sign"] }
