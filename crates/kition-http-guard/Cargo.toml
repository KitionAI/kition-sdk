[package]
name = "kition-http-guard"
description = "The transport guard of Kition's loopback HTTP servers: the {code,message,data} envelope, the per-launch API token gate with signed GET URLs, and the loopback Host and Origin fence."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Versions as Kition's runtime resolves them (its Cargo.lock), so the crate syncs back unchanged.
[dependencies]
axum = "0.8"
hex = "0.4"
http = "1"
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
