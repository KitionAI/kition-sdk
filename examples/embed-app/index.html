<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kition Embed example</title>
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Kition Embed example</strong>
      <label>User
        <select data-testid="user">
          <option value="alice">Alice</option>
          <option value="bob">Bob</option>
        </select>
      </label>
      <label>Open as
        <select data-testid="mode">
          <option value="edit">Editor</option>
          <option value="comment">Commenter</option>
          <option value="view">Viewer</option>
        </select>
      </label>
    </header>
    <div class="layout">
      <aside class="card side">
        <h2>Files</h2>
        <ul class="files" data-testid="files"></ul>
        <label class="button secondary upload">Upload…<input type="file" data-testid="upload" multiple hidden /></label>
        <p class="notice" data-testid="notice"></p>
        <ul class="errors" data-testid="errors"></ul>
      </aside>
      <main class="panes" data-testid="panes"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
