feature: sdk.dev-host.history
intent: >-
  startDevHost serves no replica, checkpoints or view state unless asked; ?replica=1 serves the
  replica alone, and ?checkpoints=1 with ?view-state=1 serves all three; a save's checkpoint and
  view state and a host checkpoint from recordCheckpoint survive devHost.reload, which reopens the
  document as its last save left it; devHost.reopenChanged closes the editor, gives the file new
  bytes at a new version and reopens it with the stored replica handed over under its earlier
  stamp, after which a kit that does not merge the file starts another lineage while one declared
  with ?replica-merges-file=1 keeps its checkpoints available (UI-R1); devHost.open starts the file
  alone (no replica, its checkpoints unavailable, the view state kept).
