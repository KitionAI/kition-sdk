format: 1
id: sdk.host.document-text/pages-within-a-limit
feature: sdk.host.document-text
intent: >-
  A kit whose manifest lists the capability document-text answers document.text through
  kition-headless with its pages joined by newlines and labelled as parts, cut at the limit in
  Unicode scalar values with truncated set, and unchanged documents; a kit without the capability
  has no such method; check_text names a kit that changes the document, ignores the limit, never
  says truncated, or puts a part outside its text (KitText 1.0 T1 to T6).
layer: golden
source:
  kind: synthetic
  from: crates/kition-kit/src/text.rs, crates/kition-kit/src/testing.rs text_tests, crates/kition-headless/src/tests.rs
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, test, -q, -p, kition-sdk, -p, kition-headless, --lib, text]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 300
