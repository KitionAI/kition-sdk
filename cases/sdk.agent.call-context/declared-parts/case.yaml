  kind: synthetic
  from: crates/kition-kits/tests/call_context.rs
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, call_context, parts_a_kit]
expected:
  - actual: out:exec
    compare: exit
    value: 0
