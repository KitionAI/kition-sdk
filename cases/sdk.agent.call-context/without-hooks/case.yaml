feature: sdk.agent.call-context
intent: >-
  A kit without the editor-state hooks (no `context.*` requests) keeps working with a run's
  `target` and with `on` for a declared target parameter; `on` for a command that reads the
  selection is `unsupported`, named, before any step runs, never the command acting on the
  selection the kit already had.
