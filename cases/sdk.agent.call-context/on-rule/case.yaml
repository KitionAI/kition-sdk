format: 1
id: sdk.agent.call-context/on-rule
feature: sdk.agent.call-context
intent: >-
  A step's `on` fills the command's declared `targets` (and then sets no selection, even for a
  command that also reads it); else it becomes the selection for a command that reads it, and an
  id parameter that is not the declared `targets` goes as given; else it is refused. Giving both
  `on` and the declared `targets` parameter is `invalid-params`, even with the same ids, and no
  other parameter conflicts with `on`.
layer: gate
source:
  kind: synthetic
  from: crates/kition-kits/src/tools/context.rs
  license: owned
input: []
steps:
  - cargo-test: { package: kition-kits, filter: on_fills_the_targets_else_the_selection_and_conflicts_only_with_the_targets_parameter }
expected:
  - actual: out:exit
    compare: exit
    value: 0
