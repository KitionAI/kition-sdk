feature: sdk.agent.call-context
intent: >-
  A step's `at.part` overrides the run's `target` for that step only, so one run edits objects
  on two parts, each reached by the ids inspect listed for its part; a failing later step rolls
  back the steps on the other parts (KHP A46, A53, A54); an `at` that is not `{part?, time?}` is
  `invalid-params`.
