format: 1
id: sdk.ui.checkpoints/editor-fallbacks
feature: sdk.ui.checkpoints
intent: >-
  A kit editor reaches checkpoints and view state only when the host lists them (checkpoints only
  for a kit that keeps its replica with the host); without them every helper answers null or does
  nothing and a save asks for no checkpoint; a refused checkpoint or a failed view-state write
  never fails the save.
