format: 1
id: sdk.agent.headless-runs/run-target
feature: sdk.agent.headless-runs
intent: >-
  The ids `<prefix>_inspect` lists for a part (`target: {slide: n}`) work in a `<prefix>_run` with
  that part as `target`, by number or by the part's id, whatever part was current before the
  call; the same id with another part as the target reaches that part's object or fails with the
  id named, never the object of the part that was current (KHP A46, A54). The mock kit's slides
  number objects per slide, so every slide has an `s1`.
layer: golden
source:
  kind: synthetic
  from: crates/kition-kits/tests/headless_runs.rs
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, headless_runs, target_]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 600
