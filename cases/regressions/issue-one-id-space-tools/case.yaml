format: 1
id: regressions/issue-one-id-space-tools
feature: sdk.agent.tool-ids
intent: >-
  An agent meets one id space in every object-model tool of a kit that declares tool ids (KHP
  A44, A46, A47, A48; KitObjectModel OM9): `<prefix>_query` and `<prefix>_batch` answer and take
  them (an object created in a batch by its `$name`, then by the id the kit gave it; a reference
  by the tool id it holds), the `kit://<document>/objects/<id>` resource takes the same id, an
  unknown id is `not-found` listing the ids it may have meant and one that two objects render is
  refused listing them, `describe` says how each type's ids read (`(ids frame:<number>)`,
  `(object ids)`, `x-kdm-id`), and a draft's comparison names objects by them. Before, these tools
  answered KDM object ids (UUIDs) while the kit's inspect, commands and diagnostics used its
  numbers, and a not-found told the agent its numbers were "command ids, not object-model ids".
layer: gate
source:
  kind: probe
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - cargo-test: { package: kition-kits, test: object_model, filter: the_tools_give_a_document_one_id_space }
  - cargo-test: { package: kition-kits, filter: describe_says_how_each_types_ids_read }
  - cargo-test: { package: kition-kits, filter: a_comparison_names_objects_by_their_tool_ids }
expected:
  - actual: out:exec
    compare: exit
    value: 0
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 120
