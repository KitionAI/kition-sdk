format: 1
id: regressions/issue-guard-batch-command-targets
feature: sdk.agent.premise-guard
intent: >-
  The objects a batch's `command` operation acts on (its command's declared `targets`) are
  premises of the batch, on any field: another author's change to one refuses the batch as
  `changed`, a change elsewhere does not. Before, a batch's command operations had no premises.
layer: golden
source:
  kind: issue
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, premise_guard, nested_a_batch_command_operation]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 600
