format: 1
id: regressions/issue-kdm-version-bytes
feature: sdk.kdm.encoding
intent: >-
  Equal replica versions encode to equal bytes in the Rust and the TypeScript KDM, whichever
  replica or order of imports made them: the entries sorted by actor id. Before, the engine wrote
  them in its hash map's order, so two replicas at the same version could answer different bytes,
  and a host comparing versions as bytes (a checkpoint at the newest one's version, a replica
  write continuing the stored history) saw two versions; Kition Table's saved-bytes tests failed
  at random.
layer: gate
source: { kind: issue, from: Kition Table content_file tests (random version mismatch), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kdm, test: version_bytes }
  - exec: { cmd: [pnpm, exec, vitest, run, packages/kdm/test/version-bytes.test.ts] }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 120
since: "2026-11-24"
