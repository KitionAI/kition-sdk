id: regressions/issue-kit-env-quoting
feature: sdk.agent.kit-env
intent: >-
  An instruction quotes an object's label with words that say truthfully which field it is: "says"
  only for text content (a `text` field, or one named `text` or `content`), "named", "titled",
  "labelled" or "captioned" for the field of that name. Before, a slide shape's `name` was quoted as
  what it says (`the shape that says "TextBox 1"`), though it shows no such text.
