format: 1
id: regressions/issue-reproducible-ids
feature: sdk.kdm.encoding
intent: >-
  In a reproducible build (the KDM's reproducible-ids feature, which only tests and sample builds
  enable, and KITION_REPRODUCIBLE_IDS set) new document ids, actors and object ids are counted from
  the seed, so a document created by the same steps saves the same bytes; without the seed they stay
  random, and SOURCE_DATE_EPOCH alone (which hosts pass to every kit) leaves them random, so two
  kit processes never mint the same ids. Before, every object a transaction created took a UUID v7
  of the clock and randomness, so a kit's saved file (layout's story paragraphs, for one) differed
  on every build of a sample; and later SOURCE_DATE_EPOCH itself switched ids to the counter in any
  process, a released kit launched by a host included (kition-table 93f535fe, 89d125ab).
layer: gate
source:
  kind: probe
  from: SDK regression suite
  license: owned
input: []
steps:
  - cargo-test: { package: kition-kdm, test: reproducible_ids }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"
