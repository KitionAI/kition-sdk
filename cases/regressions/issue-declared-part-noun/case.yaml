format: 1
id: regressions/issue-declared-part-noun
feature: sdk.agent.call-context
intent: >-
  A kit that declares `page` (or `slide`) in `agent.parts` takes that noun as the part's id as it
  lists it, in a run's `target`, a step's `at.part`, an inspect's `target` and the premise guard's
  part conflicts (which find the part's type without a `page:` tool id prefix); only a kit that
  declares no nouns takes `slide` and `page` as numbers from 1. Before, a declared `page: 0` was
  refused as "counted from 1" and an inspect went to the page numbered by it.
layer: gate
source:
  kind: issue
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, call_context, --, parts_a_declared_built_in_noun]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --lib, --, a_declared_part_noun_finds_its_type]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 600
