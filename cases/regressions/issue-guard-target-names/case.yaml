format: 1
id: regressions/issue-guard-target-names
feature: sdk.agent.premise-guard
intent: >-
  A target that also takes names (`x-khp-name: "name"`): a move of `"N2"` with `basis` is refused as
  `relocated` after a colleague renamed N2 away (naming node 2 and its name now) or gave the name to
  another node (naming both), and applies after a rename of another node. Before, the first failed
  at the kit and the second moved the other node. Ids at members marked deeper in a
  parameter (`rules[].target`) are premises.
layer: golden
source:
  kind: issue
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, space_guard, names_a_target_by_its_name_holds_the_object_it_named]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --lib, nested_marked_members_typed_values_and_names_are_premises]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 900
