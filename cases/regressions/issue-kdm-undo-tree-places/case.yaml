format: 1
id: regressions/issue-kdm-undo-tree-places
feature: sdk.model.plain-store
intent: >-
  Undo carries tree positions over later changes as it carries list positions: an undone delete or move goes back among its siblings after a sibling moved, and an undone delete whose parent is gone comes back as a root instead of failing and taking back the step below.
layer: gate
source: { kind: synthetic, from: review of the plain KDM (ccaf383), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kdm, test: undo_and_imports, filter: an_undone_delete_whose_parent_is_gone_comes_back_as_a_root }
  - cargo-test: { package: kition-kdm, test: undo_and_imports, filter: an_undone_delete_goes_back_among_its_siblings_after_a_sibling_moved }
  - cargo-test: { package: kition-kdm, test: undo_and_imports, filter: an_undone_move_goes_back_among_its_siblings_after_a_sibling_moved }
  - cargo-test: { package: kition-kdm, test: undo_and_imports, filter: a_merge_is_refused_when_the_draft_deletes_a_node_of_a_tree_the_document_changed }
expected:
  - { actual: exit, compare: exit, value: 0 }
