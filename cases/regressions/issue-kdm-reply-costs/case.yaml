format: 1
id: regressions/issue-kdm-reply-costs
feature: sdk.model.plain-store
intent: >-
  What the editor asks after every change costs about what it names or what the change touched, not the document: an agent's reply (modelReply) reads the tool ids only of the objects it names (Replica::tool_ids_of; the whole document's only when a named object's tool id names a parent or it may be a part of another), a receipt (changesSince) takes the touched objects back in a store of their own and names only the objects it holds, and model/describe finds its root without a walk (Replica::root_id). On a 200,000-object document, 100 rounds of an edit and a reply, and of an edit and a receipt, each take well under a second. Before, every reply built the tool ids of the whole document (Kition Sheet measured 1.5 to 3.7 s a reply at 200,000 cells, and 2,120 ms for the first reply after a paste with a cache per state).
layer: gate
source: { kind: issue, from: Kition Sheet modelReply timing at 200,000 cells, license: owned }
input: []
steps:
