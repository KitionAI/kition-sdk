format: 1
id: regressions/issue-mcp-default-stack
feature: sdk.host.kits-service
intent: An unoptimized `kition-kits-mcp` an agent starts, with no RUST_MIN_STACK, answers `<prefix>_inspect`, `<prefix>_query` and `<prefix>_check` instead of overflowing a worker thread's stack. The kits' executables give their runtime's worker threads an explicit stack (kition_kits::runtime). Before, a debug build aborted on the first tool call, so the agent example could not edit any file.
layer: golden
source: { kind: issue, from: SDK regression suite, licence: owned }
input: []
steps:
  - cargo-test: { package: kition-kits, test: mcp_stdio, filter: answers_tool_calls_on_the_default_thread_stack }
expected:
  - { actual: out:cargo-test, compare: exit, value: 0 }
since: "2026-11-16"
