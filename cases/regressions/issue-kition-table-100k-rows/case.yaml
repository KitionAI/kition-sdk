format: 1
id: regressions/issue-kition-table-100k-rows
feature: sdk.model.undo-footprint
intent: >-
  A transaction keeps no undo notes of the registers of objects it creates, in Rust and in
  TypeScript, while a later write is still noted and an agent's later write still survives the
  person's undo. Before, a table's bulk record create kept two notes of every cell it wrote, about
  23 KB a record, so a 100,000-record table ran out of WebAssembly memory before it was saved.
layer: gate
source: { kind: issue, from: Kition Table storage card (table-storage), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kdm, filter: a_transaction_keeps_no_notes_of_the_objects_it_creates }
  - exec: { cmd: [pnpm, exec, vitest, run, packages/kdm/test/undo-scopes.test.ts] }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 120
since: "2026-11-17"
