format: 1
id: regressions/issue-ai-dry-run-entry
feature: sdk.testing.ai-cases
intent: >-
  `cargo xtask eval --dry-run` in a kit repository checks every `layer: eval` case. Kits start
  tools/eval-cases.mjs as `<repo>/../kition-sdk/tools/eval-cases.mjs`; when that path ran through a
  symbolic link it was not the module's real path, the script's entry check never matched, and the
  dry run exited 0 having checked nothing. The script now compares real paths; a real run still
  needs a maintainer (F-QA-16).
layer: gate
source:
  kind: probe
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, tools/eval-cases.test.mjs, -t, checks the cases when started through a path that is not its real one]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 60
