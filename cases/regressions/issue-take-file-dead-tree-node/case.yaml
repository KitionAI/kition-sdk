format: 1
id: regressions/issue-take-file-dead-tree-node
feature: sdk.model.content-snapshot
intent: >-
  A file taken into the host's stored replica by its state (take_file falling back to write_state)
  adds no tree node for a deleted object: the KDM keeps a deleted object's node and the file's
  canonical state names it, and when the stored replica holds that same dead node, the written
  state equals the file's, with one node for the deleted object. Before, write_tree did not see
  the stored replica's dead node and created a second one whenever the tree had other changes.
layer: gate
source: { kind: issue, from: kition-layout fe73c628 (a workaround in bindings/wasm/tests/content_file.rs live_state), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kit, test: state, filter: a_file_taken_in_by_state_adds_no_node_for_a_deleted_item }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 60
since: "2026-11-23"
