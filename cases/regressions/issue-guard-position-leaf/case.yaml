format: 1
id: regressions/issue-guard-position-leaf
feature: sdk.agent.premise-guard
intent: >-
  A position field told at a leaf is a position: after a colleague moved a node along one axis
  (its json `location` changes at `location.0`), a rename by id (position-independent) applies and
  a move by id is refused as `relocated` with the whole location now, in the file and between
  agents. Before, a path with a `.` was read as content: the move was `changed`, the rename refused.
layer: golden
source:
  kind: issue
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, space_guard, leaf_]
expected:
  - actual: out:exec
    compare: exit
    value: 0
