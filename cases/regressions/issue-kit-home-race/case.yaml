format: 1
id: regressions/issue-kit-home-race
feature: sdk.host.headless-kit
intent: >-
  Kits started at the same moment each get their private folder (Kit Process Protocol section 3), and
  no launch sweeps away a folder another running launch holds: 16 launches making 40 homes each
  under one base all succeed, and nothing is left once they are dropped. Before, a launch's sweep
  could take another launch's lock file between its creation and its locking, remove it, and then
  remove that launch's new folder as an orphan, so kits started at once failed about one run in
  three with "could not create the kit's private folder", and the call-context tests had to start
  their kits one at a time; they start at once again.
layer: golden
source:
  kind: issue
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, test, -q, -p, kition-kit-host, --lib, homes_made_at_once_under_one_base_all_start_and_stay_until_dropped]
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, call_context]
expected:
  - actual: out:exec
    compare: exit
    value: 0
tags: [robustness]
since: "2026-11-16"
timeout_s: 600
