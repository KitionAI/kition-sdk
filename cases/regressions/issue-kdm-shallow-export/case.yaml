format: 1
id: regressions/issue-kdm-shallow-export
feature: sdk.model.new-document
intent: >-
  A shallow replica (KitModel M16a), above all a document copied or forked as a new document,
  answers every change it has (export since the empty version, or any version before its root) in
  bytes that load as the document, in Rust and TypeScript and across the two, so the object model
  over the change exchange (model.batch, model.describe), an agent's draft (model.export, then
  model.open, then model.import back), undo, fork, rebase and merge work on a forked file as on any
  document; a full replica's export is unchanged. Before, it answered only the changes after its
  root, which load refused ("meta.kit is missing"): the first kit to adopt document.fork found
  model.batch and drafts failing on every forked file.
layer: gate
source: { kind: issue, from: kition-board 6f586f3 (a workaround in bindings/wasm/src/collab.rs model_export), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kdm, test: shallow_export }
  - cargo-test: { package: kition-kdm, test: cross_language, filter: shallow_export }
  - cargo-test: { package: kition-kit, test: model, filter: forked }
  - cargo-test: { package: kition-headless, filter: a_replica_port_kit_serves_a_forked_document }
  - exec: { cmd: [cargo, build, -q, -p, kition-kit-mock] }
  - cargo-test: { package: kition-kit-host, test: document_identity, filter: a_draft_of_a_forked_file }
  - exec: { cmd: [pnpm, exec, vitest, run, packages/kdm/test/shallow-export.test.ts, packages/kdm/test/cross-language.test.ts] }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 60
since: "2026-11-20"
