format: 1
id: regressions/issue-managed-save-before-join
feature: sdk.collab.saves
intent: >-
  A kit that saves its file after it mounts but before the page joined the managed room (Doc rewrites
  what it opened) is not blocked and never writes the file itself, which would end the room's
  generation and throw every co-editor out: the save is written through the room, with the room's
  receipt, once the room is joined.
layer: unit
source:
  kind: issue
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, packages/embed/test/managed.test.ts, -t, before the room is joined]
expected:
  - actual: out:exec
    compare: exit
    value: 0
timeout_s: 120
