format: 1
id: regressions/issue-outside-change-stale-document
feature: sdk.agent.headless-runs
intent: >-
  When a file the agent edits headless changed outside its calls (KHP A56), the server reads the
  file again before it answers: the inspect that reports `changedOutside` shows the file as it now
  is, with the summaries before and after, and the run after the one refused proceeds on the new
  file and keeps the change made outside. Before, the kit kept the document it had read earlier:
  inspect showed the old content, and the retried run failed to save with a file conflict.
layer: gate
source:
  kind: issue
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, headless_runs, after_a_change_outside]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 600
