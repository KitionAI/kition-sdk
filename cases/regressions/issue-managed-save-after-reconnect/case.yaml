format: 1
id: regressions/issue-managed-save-after-reconnect
feature: sdk.collab.saves
intent: >-
  A Save made while a managed room's connection is coming back (the open token was revoked by a
  password change) saves through the room once it is joined again, and never waits forever: a
  sync request made while offline fails at once, and a failed write is reported as failed even
  when its save/end cannot be sent. Before, the request went into the closed socket and the Save
  never finished.
layer: unit
source:
  kind: issue
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, packages/sync/test/client.test.ts, packages/sync/test/saves.test.ts, packages/embed/test/managed.test.ts, -t, "offline at once|connection drops during it|dropped just before"]
expected:
  - actual: out:exec
    compare: exit
    value: 0
timeout_s: 120
since: "2026-11-16"
