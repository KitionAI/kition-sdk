format: 1
id: regressions/issue-escape-keeps-held-gesture
feature: sdk.editor.display-modes
intent: >-
  Escape while a gesture is held on a kit canvas drops it, so the release commits nothing, and that Escape is the gesture's alone (KitPointer 4.1, 4.3). Photo wrapped every tool to do this itself; other canvas kits committed the drag on release.
layer: golden
source:
  kind: probe
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, packages/kit-editor/src/engine/KitCanvas.view.test.tsx, -t, "drops a held gesture on Escape"]
expected:
  - actual: out:exec
    compare: exit
    value: 0
timeout_s: 60
since: "2026-11-16"
