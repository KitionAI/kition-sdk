format: 1
id: regressions/issue-sync-relay-refused-push
feature: sdk.collab.fork-rooms
intent: >-
  What the relay has sent advances only once the room takes a push: a push the server refuses, or
  that fails, is exported again with the next one, and onSent reports only what the room holds.
  Before, lastSent advanced before the push was answered, so a refused change never reached the
  room and the replica stayed diverged from it.
layer: gate
source: { kind: issue, from: fork-rooms audit (relay.ts lastSent advanced before the push succeeded), license: owned }
input: []
steps:
  - exec: { cmd: [pnpm, exec, vitest, run, packages/sync/test/relay.test.ts, -t, pushes that fail] }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 60
since: "2026-11-20"
