format: 1
id: regressions/issue-inspect-part-id
feature: sdk.agent.call-context
intent: >-
  `<prefix>_inspect {target: {sheet: 3}}` passes the sheet's integer id to the kit's reader, as a
  string id is passed: a part noun's value is the part's id wherever a target names a part. Before,
  an integer was dropped and the active sheet's content was shown instead, silently.
