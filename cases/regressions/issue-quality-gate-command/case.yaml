format: 1
id: regressions/issue-quality-gate-command
feature: sdk.quality.sync
intent: >-
  tools/sync-quality.mjs takes a repository's check command from templates/quality/repositories.json
  by the repository's directory name and refuses a --command that disagrees, so a sync never puts
  back an old gate. the protocol documentation gate skips the git-ignored node_modules and dist folders; before, the command lived only in whatever --command the person running
  the sync typed, and the next sync could revert the fix in AGENTS.md, docs/quality.md and the Stop hook.
layer: gate
source:
  kind: probe
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, tools/sync-quality.test.mjs, -t, takes a listed repository]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 120
