format: 1
id: regressions/issue-link-swap-read
feature: sdk.gateway.security
intent: >-
  A workspace file was checked (links followed, inside the workspace) and then opened by path, so
  a link swapped in between led the read out of the workspace. open_inside opens the checked real
  path, checks again after the open, and refuses a file that is not the one at the checked path:
  a link flipping between a file inside and one outside never lets the outside file be read.
layer: gate
dimension: security
