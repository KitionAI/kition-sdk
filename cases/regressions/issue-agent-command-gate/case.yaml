format: 1
id: regressions/issue-agent-command-gate
feature: sdk.security.agent-command-gate
intent: >-
  Every way an agent runs a command passes the gate `command.execute` applies (KHP A28, A29,
  §10.6): a `command` operation of `model.batch` naming a command that names files, or one the
  manifest keeps from the agent (`agent.exclude`), fails the whole batch before anything runs with
  the error `command.execute` answers and `data.model.code` `not-allowed` (an unknown id
  `unknown-command`); a kit's own dispatcher (macro, script, step list) asks
  `kition_kit::dispatch::may_run` before each step and fails on a step the caller may not run;
  an agent's connection runs nothing as the person. Before, a batch's command operation went
  straight to the kit's `execute_as` (a workspace audit wrote outside the workspace
  this way with film, vector and layout).
layer: gate
source:
  kind: probe
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, test, -q, -p, kition-headless, --lib, gate_tests]
  - exec:
      cmd: [cargo, test, -q, -p, kition-sdk, --test, nested_dispatch]
  - exec:
      cmd: [cargo, test, -q, -p, grid-kit-headless, --test, protocol, a_host_written_from_the_spec_drives_the_kit]
expected:
  - actual: out:exec
    compare: exit
    value: 0
tags: [security]
since: "2026-11-16"
timeout_s: 600
