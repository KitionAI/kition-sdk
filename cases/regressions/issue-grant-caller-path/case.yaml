id: regressions/issue-grant-caller-path
feature: sdk.gateway.security
intent: >-
  POST /kits/grants took the path of the file the person picked from its caller, so whoever could
  call it granted a kit any workspace file it named. A grant now names a choice the server offered
  to that session (POST /kits/grants/choices) and takes no path; a path, a made-up choice, another
  session's choice, an expired one, and a new file name that is not one plain visible name grant
  nothing.
