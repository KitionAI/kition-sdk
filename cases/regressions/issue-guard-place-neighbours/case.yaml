format: 1
id: regressions/issue-guard-place-neighbours
feature: sdk.agent.premise-guard
intent: >-
  A change next to a place in time, not under it (a ripple insert at the end of the clip under
  2.5 s, the clip after it deleted leaving a gap, the clip before it trimmed), in the file or by
  another agent, does not refuse a cut at 2.5 s: the guard replays which clips covered the place
  from the times the change sets carry, and `others` never shows the deleted clips' `$was`.
  Before, an object next to the window refused it.
layer: golden
source:
  kind: issue
  from: SDK regression suite
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, place_guard, exact_a_change_next_to_the_place_applies]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 900
