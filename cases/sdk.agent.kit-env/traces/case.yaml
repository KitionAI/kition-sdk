intent: >-
  The oracle replays every generated task's ground truth through the agent-facing tools
  (inspect, batch, check) to reward 1, and with `find` reads the object model until every id it
  names was answered first; traces are JSON lines with images replaced by their hashes, and only
  traces with reward 1 are emitted.
layer: gate
