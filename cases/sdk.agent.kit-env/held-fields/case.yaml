format: 1
id: sdk.agent.kit-env/held-fields
feature: sdk.agent.kit-env
intent: >-
  kit-env samples a scalar field of an object without a tool id (a paragraph of a shape's text body)
  and writes it through the shape that holds it at a path (`{ op: "set", target: <shape>, field:
  "body.paragraphs.0.text" }`); the instruction names it through its holder (`the text of the 1st
  paragraph of …`) and the oracle's solution replays it. A schema's `label`, `display` and `sample:
  false` are described alike by Rust and TypeScript.
layer: gate
source:
  kind: synthetic
  from: SDK regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-env, --test, generate, a_held_objects_field_is_edited_through_its_holder]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kdm, --test, batch, describe_names_labels_displays_and_samples]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
timeout_s: 900
