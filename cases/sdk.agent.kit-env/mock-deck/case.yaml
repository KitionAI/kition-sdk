  kind: synthetic
  from: crates/kition-env/tests/mock_deck.rs
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-env, --test, mock_deck]
expected:
  - actual: out:exec
    compare: exit
    value: 0
