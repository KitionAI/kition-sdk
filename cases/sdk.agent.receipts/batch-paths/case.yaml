intent: >-
  A batch's `set` and `text.set` take `field` as a path from the target to a field of a held object
  without a tool id, positional (`props.children.1.children.1.value.v`) or in the kit's words
  (`transform/opacity.value.v`, `effects/blur#2.value.v`), past a json field into its value; the
  receipt names the change at that path; a path past a list's end, to no field, in words no held
  object has, or `text.set` into a value is refused as `invalid-op`, with the same message in Rust
  and TypeScript.
