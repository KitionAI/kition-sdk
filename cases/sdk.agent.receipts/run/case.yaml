  from: crates/kition-kits/tests/receipts.rs
  licence: owned
input: []
steps:
  - exec:
      cmd: [cargo, build, -q, -p, kition-kit-mock]
  - exec:
      cmd: [cargo, test, -q, -p, kition-kits, --test, receipts, run_]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-16"
