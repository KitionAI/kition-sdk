format: 1
id: sdk.agent.receipts/run
feature: sdk.agent.receipts
intent: >-
  A headless `<prefix>_run` (on the file or on a headless draft) answers `changes` for the whole
  run: the one object it changed with each field before and after, not the objects beside it; a
  run of many steps lists each object once; a run with no effect an empty change set and the same
  `revision`; a failed, rolled-back run no `changes`, `revision` or `diagnostics`.
layer: golden
