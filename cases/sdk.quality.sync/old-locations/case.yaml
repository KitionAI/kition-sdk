intent: >-
  tools/sync-quality.mjs writes the quality reference to docs/quality.md and the Claude Code pointer
  to .claude/CLAUDE.md, whose import (@../AGENTS.md) resolves from .claude/. A CLAUDE.md, QUALITY.md
  or kit-waivers.yaml left at the repository root is a finding that names the git mv to run: --verify
  exits 1, and a write run writes nothing and exits 1 until the files are moved, so a migrated
  repository can be told from one that is not and no repository's own text is left behind.
