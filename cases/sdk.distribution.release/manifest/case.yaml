format: 1
id: sdk.distribution.release/manifest
feature: sdk.distribution.release
intent: >-
  The release manifest names each platform bundle with its SHA-256 and versioned URL, every
  executable in it, each kit's package and the tag and commit its executable was built from, and
  each schema as its own asset; SHA256SUMS covers every asset; bundles of another version or
  commit, from a checkout with changes, or with a kit executable that answers another version
  than its package are refused; only kit executables are checked with kit.initialize.
