format: 1
id: sdk.distribution.release/index-snapshot
feature: sdk.distribution.release
intent: >-
  A release carries kits-index.json, a snapshot of the kit index (format 2, the npm packages)
  gathered when it is made, a record that kition does not read. The release tool checks it against
  kits-index.schema.json, names it in the release manifest (index, with its size, SHA-256 and
  versioned URL) and in SHA256SUMS, and refuses a release without it, with one that is not JSON, not
  valid against the schema or with no kit, or with any other kits-index*.json beside it; a kit
  package is still refused.
layer: gate
dimension: platform
source:
  kind: synthetic
  from: tools/sdk-release.test.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, tools/sdk-release.test.mjs, -t, kit index snapshot]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-18"
timeout_s: 60
