format: 1
id: sdk.packages.stage/rehearsal
feature: sdk.packages.stage
intent: >-
  The rehearsal copy of the packed @kition/sdk is <scope>/sdk at the version given, its optional
  peer kept as @kition/tessera at exactly the rehearsal Tessera's version, every other field and
  file as packed; it is packed by npm without running scripts, from the archive or its folder, and
  what it was given and this checkout are untouched; @kition, a scope of another form, a version
  that is not semantic (or has build metadata) and a Tessera not named <scope>/tessera@<version>
  are refused. release.yml with a stage scope (by hand only; its default) builds and checks
  @kition/sdk against the rehearsal Tessera installed from npm under the name @kition/tessera,
  publishes the copy with the stage token only, waits until npm serves it, and prints the two lines
  a kit puts in web/package.json; migrate-to-sdk writes those lines with --sdk-spec and
  --tessera-spec. The same path releases @kition: the release target (every version source agrees,
  every platform, the peer at ^0.1.0), the copies as packed, and the publishing order and checks
  are tested with it.
layer: gate
