format: 1
id: sdk.distribution.npm/doctor-path
feature: sdk.distribution.npm
intent: >-
  Started from a global npm install, kition doctor's PATH check passes when npm's folder of
  commands (which holds npm's kition command) is on the PATH and fails with the line that adds
  that folder, not the node_modules folder holding the executable, when it is not; through npx,
  or from a project's node_modules, it says there is no kition command on the PATH, for
  information, with npm install -g kition as the fix, and does not fail.
layer: gate
dimension: platform
source:
  kind: synthetic
  from: crates/kition-cli/tests/doctor.rs
  license: owned
input: []
steps:
  - cargo-test: { package: kition-cli, test: doctor, filter: doctor_checks_the_npm_command_on_the_path }
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-19"
timeout_s: 300
