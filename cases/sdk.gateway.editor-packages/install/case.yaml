format: 1
id: sdk.gateway.editor-packages/install
feature: sdk.gateway.editor-packages
intent: >-
  kition kit install brings each kit's editor package from the npm registries beside it
  (kits/<kit>/ui/<version>/: the package's top folder, index.html, kit.json, scripts, engine, fonts;
  nothing left in tmp/), says when the index lists none, and installs it again when it is missing;
  kit upgrade installs the new version's and removes the older; kit remove removes them; kit list
  (EDITOR installed, missing, none; --json editor), kit info and doctor (editor <kit>, ok or info
  with its fix) show it. A package with another integrity or size than the index gives, whose
  package.json names another package or version, another kit's, one with an entry outside its
  folder, or one with no editor is refused and nothing is installed.
layer: gate
dimension: security
source:
  kind: synthetic
  from: crates/kition-cli/tests/editors.rs
  license: owned
input: []
steps:
  - cargo-test: { package: kition-cli, test: editors, filter: install_and_upgrade_bring_the_editor }
  - cargo-test: { package: kition-cli, test: editors, filter: an_editor_package_that_is_not_the_one_the_index_gives_is_refused }
  - cargo-test: { package: kition-cli, filter: "editors::" }
expected:
  - { actual: out:exit, compare: exit, value: 0 }
since: "2026-11-19"
timeout_s: 300
