format: 1
id: sdk.gateway.editor-packages/index
feature: sdk.gateway.editor-packages
intent: >-
  The kit index gatherer lists each version's editor package as `ui {package, size, integrity}`: the
  npm package @kition/kit-<kit>-ui at the version, its tarball's size and npm's integrity from the
  registry's metadata, its kition field agreeing with the version's headless packages (else the run
  stops); a version whose editor package is not on the registry is listed without `ui`; an editor
  package without a headless one is left out and named; the field is in the schema and in its place
  in the written index.
