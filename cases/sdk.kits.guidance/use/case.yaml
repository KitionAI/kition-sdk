feature: sdk.kits.guidance
intent: >-
  A kit says in its manifest what an agent makes one of its files for (`agent.describe.use`,
  platform K21), and a host's instructions say it from the manifest: `Use a .<extension> file
  through the <name> kit for <use>.`, with the first extension the kit creates. A kit that names
  no use, and a kit that creates nothing, give no guidance, so a host's instructions name no kit
  of their own.
