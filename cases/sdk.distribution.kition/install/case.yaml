format: 1
id: sdk.distribution.kition/install
feature: sdk.distribution.kition
intent: >-
  install.sh, run against a release served on loopback, installs this platform's kition from the
  latest release or a given version into $KITION_HOME/bin (~/.kition/bin by default), leaves no
  download behind, writes no shell profile and prints the PATH line only when it is needed; an
  archive that does not match SHA256SUMS, a release without this platform, a missing version, or
  Linux with the musl C library installs nothing and says why.
