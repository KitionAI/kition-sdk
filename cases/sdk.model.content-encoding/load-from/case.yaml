intent: >-
  Replica::load_from reads content from a reader in chunks, so a large content.json streamed from a container is never held whole beside the store: every fixture read one, two, three, seven or 4,096 bytes at a time is the replica Replica::load makes of its bytes (same version, snapshot and content bytes), what load refuses load_from refuses with the same kind of error, a failing reader is an encoding error, and a 20,000-entry document streamed 4 KB at a time saves to its bytes.
