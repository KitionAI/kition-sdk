format: 1
id: sdk.collab.fork-rooms/create-and-converge
feature: sdk.collab.fork-rooms
intent: >-
  A copy made as a new document (copy_as_new_document, copyAsNewDocument, and so every file
  document.fork writes) is shallow, rooted at its birth, which its first change records: it and
  every replica loaded from it carry the document's whole history (carries_whole_history,
  carriesWholeHistory, and the schema-free snapshot_carries_whole_history for a server), the same in
  Rust, TypeScript and across the two, while a replica truncated later, a shallow document that
  records no birth, and a birth claimed in a change after the root do not. A sync room is made from
  such a copy (sync protocol S20, against a fake server that refuses what Kition Server refuses):
  members catch up, co-edit, reconnect, reload from the stored replica and converge, through the
  embed and through a script's room handle; a truncated replica is refused with a clear error before
  room/create.
layer: gate
source: { kind: synthetic, from: kition-one (copied files, templates and repeated uploads co-edited as their own documents), license: owned }
input: []
steps:
  - cargo-test: { package: kition-kdm, test: whole_history }
  - cargo-test: { package: kition-kdm, test: cross_language, filter: whole_history }
  - cargo-test: { package: kition-kit-server, filter: a_forked_files_replica_carries_its_whole_history }
  - exec: { cmd: [pnpm, exec, vitest, run, packages/kdm/test/whole-history.test.ts, packages/kdm/test/cross-language.test.ts, packages/sync/test/replicaVersions.test.ts] }
  - exec: { cmd: [pnpm, exec, vitest, run, packages/script/test/room.test.ts, packages/embed/test/collab.test.ts, -t, copy made as a new document] }
expected:
  - { actual: exit, compare: exit, value: 0 }
timeout_s: 120
since: "2026-11-20"
