format: 1
id: sdk.agent.premise-guard/position
feature: sdk.agent.premise-guard
intent: >-
  Position is a premise only when the command depends on it: after a ripple insert moved clip 3,
  a write declared `x-khp-position: independent` (its opacity) applies and `others` says the clip
  moved, while one that is not (its duration) is refused as `relocated` with where the clip is
  now; a `start` changed alone (a field the schema marks `position`) is a move, not a change of
  content. Integer tool ids are numbers in receipts, `others` and conflicts, and `on` takes `3`
  or `"3"`.
