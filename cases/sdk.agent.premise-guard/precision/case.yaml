id: sdk.agent.premise-guard/precision
feature: sdk.agent.premise-guard
intent: >-
  A write that passes `basis` runs when others changed only other objects since, and its answer
  names what they changed and who (`others`, `by`); the agent's own earlier writes never refuse
  it, even ones that moved objects. Under `--guard epoch` the same write is refused, under
  `--guard off` nothing is.
